<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DatioLabs - Conectando...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f9fafb; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .c { text-align: center; padding: 2rem; }
        .spinner { width: 48px; height: 48px; border: 4px solid #1a1a1a; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 1.25rem; font-weight: 900; color: #1a1a1a; margin-bottom: 0.5rem; }
        p { font-size: 0.75rem; color: #6b7280; }
        .ok { border-color: #22c55e; border-top-color: transparent; }
        .err { border-color: #ef4444; border-top-color: transparent; animation: none; }
    </style>
</head>
<body>
    <div class="c">
        <div id="sp" class="spinner"></div>
        <h1 id="t">CONECTANDO...</h1>
        <p id="s">Estableciendo conexion P2P...</p>
    </div>
    <script>
    (async function() {
        const sp = document.getElementById('sp');
        const t = document.getElementById('t');
        const s = document.getElementById('s');
        const params = new URLSearchParams(window.location.search);
        const room = params.get('room');
        const pin = params.get('pin') || 'default';
        if (!room) { t.textContent='ERROR'; s.textContent='Falta parametro room'; sp.className='spinner err'; return; }

        const SB = window.__SIGNALING_URL__ || 'wss://datiolabs-signaling.apex-importvcb.workers.dev';
        const STUN = { iceServers:[
            {urls:'stun:stun.cloudflare.com:3478'},
            {urls:'stun:stun.l.google.com:19302'},
            {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
            {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
            {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}
        ]};

        function setUI(state, title, msg) {
            sp.className = 'spinner' + (state==='ok'?' ok':state==='err'?' err':'');
            t.textContent = title;
            s.textContent = msg;
        }

        try {
            const ws = new WebSocket(SB+'/ws/signaling?room='+room+'&pin='+encodeURIComponent(pin));
            ws.onopen = () => setUI('','Senalizacion OK','Esperando conexion P2P...');
            ws.onerror = () => { setUI('err','Error','No se pudo conectar al servidor'); };

            let pc, dc;
            ws.onmessage = async (ev) => {
                const msg = JSON.parse(ev.data);
                if (msg.type==='offer') {
                    setUI('','Estableciendo P2P...','Offer recibido, creando respuesta...');
                    pc = new RTCPeerConnection(STUN);
                    pc.onicecandidate = (e) => {
                        if (e.candidate && ws.readyState===1) ws.send(JSON.stringify({type:'ice-candidate',candidate:e.candidate}));
                    };
                    dc = pc.createDataChannel('api',{ordered:true});
                    dc.onopen = async () => {
                        setUI('ok','Conexion P2P lista','Cargando aplicacion...');
                        try {
                            ws.close();
                        } catch(_){}
                        try {
                            dc.send(JSON.stringify({id:'spa-req',comando:'obtener_spa'}));
                        } catch(_){}
                    };
                    dc.onmessage = (ev2) => {
                        try {
                            const r = JSON.parse(ev2.data);
                            if (r.id==='spa-req' && r.body) {
                                const html = r.body.html;
                                const jsUrl = r.body.jsUrl;
                                const cssUrl = r.body.cssUrl;
                                document.open();
                                document.write(html);
                                document.close();
                                if (cssUrl) {
                                    const link = document.createElement('link');
                                    link.rel = 'stylesheet';
                                    link.href = cssUrl;
                                    document.head.appendChild(link);
                                }
                                if (jsUrl) {
                                    const script = document.createElement('script');
                                    script.src = jsUrl;
                                    document.head.appendChild(script);
                                }
                            }
                        } catch(_){}
                    };
                    dc.onclose = () => {
                        if (!document.querySelector('script[src]')) {
                            setUI('err','Conexion perdida','Recargue la pagina para reconectar');
                        }
                    };
                    await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
                    const ans = await pc.createAnswer();
                    await pc.setLocalDescription(ans);
                    ws.send(JSON.stringify({type:'answer',sdp:pc.localDescription}));
                } else if (msg.type==='error') {
                    setUI('err','Error',msg.message||'Error de conexion');
                }
            };
            ws.onclose = () => {
                if (!dc || dc.readyState!=='open') {
                    setTimeout(()=>location.reload(), 3000);
                }
            };
        } catch(e) {
            setUI('err','Error','No se pudo conectar: '+e.message);
        }
    })();
    </script>
</body>
</html>
